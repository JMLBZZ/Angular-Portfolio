<div class="space-y-2">
  <label
    *ngIf="label"
    [class]="labelClasses"
    [attr.for]="computedId"
  >
    {{ label }}

    <span
      *ngIf="shouldShowRequiredStar"
      class="ml-1 text-red-500"
      aria-hidden="true"
    >
      *
    </span>
  </label>

  <input
    [id]="computedId"
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    [class]="inputClasses"
    [attr.aria-required]="isRequired ? 'true' : null"
    [attr.aria-invalid]="shouldShowError ? 'true' : 'false'"
    [attr.aria-describedby]="describedBy"
  />

  <p
    *ngIf="shouldShowError && computedErrorText"
    class="text-xs text-red-500"
    [id]="errorId"
  >
    {{ computedErrorText }}
  </p>
</div>
