<app-header></app-header>

<main class="min-h-[70vh]">
  <section class="max-w-6xl mx-auto px-4 py-24">
    <div class="mb-12">
      <a
        routerLink="/"
        class="inline-flex items-center text-sm text-primary hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 rounded-md"
      >
        ← Retour au portfolio
      </a>

      <p class="mt-8 text-sm uppercase tracking-[0.25em] text-primary font-semibold">
        Informations légales
      </p>

      <h1 class="mt-4 text-4xl font-bold text-foreground">
        {{ title }}
      </h1>
    </div>

    <div
      *ngIf="isLoading"
      class="text-sm text-foreground/70"
      aria-live="polite"
    >
      Chargement du contenu légal...
    </div>

    <div
      *ngIf="errorMessage"
      class="rounded-3xl border border-red-500/40 bg-red-500/5 p-6 text-sm text-red-600"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </div>

    <article
      *ngIf="!isLoading && !errorMessage"
      class="
        max-w-4xl

        [&_h1]:hidden

        [&_h2]:mt-12
        [&_h2:first-child]:mt-0
        [&_h2]:text-2xl
        [&_h2]:font-bold
        [&_h2]:text-foreground

        [&_h3]:mt-8
        [&_h3]:mb-2
        [&_h3]:text-lg
        [&_h3]:font-semibold
        [&_h3]:text-foreground

        [&_p]:mt-4
        [&_p]:text-sm
        [&_p]:leading-relaxed
        [&_p]:text-foreground/70

        [&_ul]:mt-4
        [&_ul]:space-y-2
        [&_ul]:pl-5
        [&_ul]:list-disc
        [&_ul]:text-sm
        [&_ul]:text-foreground/70

        [&_ol]:mt-4
        [&_ol]:space-y-2
        [&_ol]:pl-5
        [&_ol]:list-decimal
        [&_ol]:text-sm
        [&_ol]:text-foreground/70

        [&_li]:leading-relaxed

        [&_strong]:font-semibold
        [&_strong]:text-foreground

        [&_a]:text-primary
        [&_a]:underline
        [&_a]:underline-offset-4
        hover:[&_a]:opacity-80
      "
      [innerHTML]="content"
    ></article>
  </section>
</main>

<app-footer></app-footer>
