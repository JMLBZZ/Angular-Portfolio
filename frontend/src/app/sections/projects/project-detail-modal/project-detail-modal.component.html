<div *ngIf="open" class="fixed inset-0 z-50 flex items-center justify-center p-4">

  <!-- BACKDROP -->
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-100]="isVisible"
    [class.opacity-0]="!isVisible"
    (click)="onClose()">
  </div>

  <!-- MODAL (scrollable) -->
  <div
    class="relative w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-2xl border border-border bg-card shadow-[0_30px_80px_rgba(0,0,0,0.35)] transition-all duration-300"
    [class.opacity-100]="isVisible"
    [class.scale-100]="isVisible"
    [class.opacity-0]="!isVisible"
    [class.scale-95]="!isVisible"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="project?.title ? 'Détail du projet ' + project?.title : 'Détail du projet'"
    [attr.aria-labelledby]="dialogTitleId"
    [attr.aria-describedby]="dialogDescriptionId">

    <!-- IMAGE / CAROUSEL -->
    <div
      class="relative aspect-video bg-muted overflow-hidden touch-pan-y"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
      (pointercancel)="onPointerCancel()"
    >
      <!-- Crossfade layers -->
      <ng-container *ngIf="layers.length > 0; else noImage">
        <img
          *ngFor="let layer of layers; let i = index; trackBy: trackLayer"
          [src]="layer.src"
          appFallbackImage
          [alt]="project?.title ? 'Visuel du projet ' + project?.title : 'Visuel du projet'"
          class="absolute inset-0 h-full w-full object-cover select-none"
          [style.zIndex]="i"
          [@crossfade]
          decoding="async"
          width="1200"
          height="675"
          draggable="false" />
      </ng-container>

      <ng-template #noImage>
        <div class="h-full w-full flex items-center justify-center bg-muted">
          <div class="flex flex-col items-center justify-center px-6 text-center">
            <img
              src="assets/projects/project-placeholder.svg"
              appFallbackImage
              alt=""
              class="h-24 w-auto opacity-80"
              width="160"
              height="100"
              draggable="false" />
            <span class="mt-4 text-sm text-foreground/60">No image - Aucune image</span>
          </div>
        </div>
      </ng-template>

      <!-- Close -->
      <button
        #closeButton
        class="absolute top-4 right-4 z-20 rounded-xl bg-card/80 px-3 py-1 text-sm border border-border backdrop-blur hover:bg-card transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
        (click)="onClose()"
        type="button"
        aria-label="Fermer la fenêtre du projet">
        ✕
      </button>

      <!-- Prev / Next -->
      <button
        *ngIf="hasCarousel"
        class="absolute left-3 top-1/2 z-20 -translate-y-1/2 rounded-xl bg-black/40 px-3 py-2 text-white backdrop-blur hover:bg-black/55 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
        type="button"
        (click)="prev()"
        aria-label="Image précédente">
        ‹
      </button>

      <button
        *ngIf="hasCarousel"
        class="absolute right-3 top-1/2 z-20 -translate-y-1/2 rounded-xl bg-black/40 px-3 py-2 text-white backdrop-blur hover:bg-black/55 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
        type="button"
        (click)="next()"
        aria-label="Image suivante">
        ›
      </button>

      <!-- Points -->
      <div *ngIf="hasCarousel" class="absolute bottom-3 left-0 right-0 z-20 flex items-center justify-center gap-2">
        <button
          *ngFor="let _ of images; let i = index"
          type="button"
          class="h-2.5 w-2.5 rounded-full transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
          [ngClass]="{
            'bg-white': i === activeImageIndex,
            'bg-white/40 hover:bg-white/70': i !== activeImageIndex
          }"
          (click)="goTo(i)"
          [attr.aria-label]="'Aller à l’image ' + (i + 1)">
        </button>
      </div>

    </div>

    <!-- CONTENT -->
    <app-project-content
      *ngIf="project"
      [project]="project">
    </app-project-content>
  </div>
</div>
