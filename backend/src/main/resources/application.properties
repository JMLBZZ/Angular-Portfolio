spring.application.name=portfolio-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#Sur MAC, mettre le nom de l'ordinateur - Sur Win, mettre postgre
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nabjam}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nabjam}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.default-flat-param-object=true

#Clé 32 caractères minimum sinon JWT refuse
security.jwt.secret=${JWT_SECRET:my-super-secret-key-my-super-secret-key}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# environnement prod : false
app.seed-admin.enabled=false

# environnement dév: (supprimer la ligne pour l'envoie prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================
# CONTACT / SMTP
# =========================
# À qui tu veux recevoir les messages (ta boîte)
#app.contact.to=${CONTACT_TO:contact@alexandredumont.dev}
#app.contact.to=contact@alexandredumont.dev

# "From" technique (souvent doit être le compte SMTP)
#app.contact.from=${CONTACT_FROM:${spring.mail.username:no-reply@portfolio.dev}}
#app.contact.from=no-reply@localhost.localdomain

# Timeout (optionnel)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# DEV SMTP (MailHog)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

# Contact addresses
app.contact.from=${APP_CONTACT_FROM:no-reply@localhost.localdomain}
app.contact.to=${APP_CONTACT_TO:jamel@hotmail.fr}

# UPLOADS
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.projects-subdir=${APP_UPLOAD_PROJECTS_SUBDIR:projects}
app.upload.resumes-subdir=${APP_UPLOAD_RESUMES_SUBDIR:resumes}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# SEO
app.seo.public-base-url=${APP_SEO_PUBLIC_BASE_URL:http://localhost:4200}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# DEEPL TRANSLATION
# EN-US par défaut car la librairie DeepL n'accepte pas "EN" seul.
app.translation.deepl.auth-key=${DEEPL_AUTH_KEY:}
app.translation.deepl.source-lang=${DEEPL_SOURCE_LANG:FR}
app.translation.deepl.target-lang=${DEEPL_TARGET_LANG:EN-US}

# TRANSLATION RATE LIMIT
app.translation.rate-limit.enabled=${TRANSLATION_RATE_LIMIT_ENABLED:true}
app.translation.rate-limit.max-requests=${TRANSLATION_RATE_LIMIT_MAX_REQUESTS:3}
app.translation.rate-limit.window-seconds=${TRANSLATION_RATE_LIMIT_WINDOW_SECONDS:60}