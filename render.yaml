services:
  - type: web
    name: portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /robots.txt
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION_MS
        value: 3600000

      - key: APP_UPLOAD_DIR
        value: /var/data/uploads

      - key: APP_SEO_PUBLIC_BASE_URL
        sync: false

      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

      - key: APP_CONTACT_FROM
        sync: false

      - key: APP_CONTACT_TO
        sync: false

  - type: web
    name: portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PUBLIC_API_BASE_URL
        sync: false

      - key: PROJECTS_API_URL
        sync: false

      - key: SITE_URL
        sync: false

databases:
  - name: portfolio-db
    region: frankfurt
    plan: basic-256mb
    databaseName: portfolio_db
    user: portfolio_user
    diskSizeGB: 5
    storageAutoscalingEnabled: true